[project]
name = "webhook-hub"
version = "0.1.0"
description = "Self-hosted webhook router/hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137",
  "uvicorn[standard]>=0.49",
  "sqlalchemy[asyncio]>=2.0.50",
  "asyncpg>=0.31",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  "alembic>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "httpx>=0.28", "respx>=0.23"]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
